<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster - Tu Lista de Tareas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-screen p-4 sm:p-8">
  
  <div class="max-w-4xl mx-auto">
    
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-6xl font-black mb-3 gradient-text">
        ✨ TaskMaster
      </h1>
      <p class="text-slate-400 text-lg">
        Organiza tu vida, una tarea a la vez
      </p>
    </header>

    <!-- Main Container -->
    <div class="bg-slate-800/50 backdrop-blur-xl rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-700/50">
      
      <!-- Input Section -->
      <div class="mb-8">
        <div class="flex gap-3 mb-4">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="¿Qué necesitas hacer?"
            autocomplete="off"
            class="flex-1 px-6 py-4 bg-slate-900/80 text-slate-100 text-lg border-2 border-slate-700 
                   rounded-2xl placeholder:text-slate-500
                   focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 
                   transition-all duration-300"
          >
          <button 
            id="addBtn" 
            class="px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-lg
                   rounded-2xl hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/40 
                   active:translate-y-0 transition-all duration-300 flex items-center gap-2
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0"
          >
            <span class="text-2xl leading-none">+</span>
            <span class="hidden sm:inline">Agregar</span>
          </button>
        </div>
        
        <!-- Stats -->
        <div class="flex gap-3 text-sm">
          <div class="flex-1 bg-slate-900/50 rounded-xl p-3 text-center border border-slate-700/50">
            <div class="text-2xl font-bold text-indigo-400" id="totalCount">0</div>
            <div class="text-slate-400 text-xs">Total</div>
          </div>
          <div class="flex-1 bg-slate-900/50 rounded-xl p-3 text-center border border-slate-700/50">
            <div class="text-2xl font-bold text-amber-400" id="pendingCount">0</div>
            <div class="text-slate-400 text-xs">Pendientes</div>
          </div>
          <div class="flex-1 bg-slate-900/50 rounded-xl p-3 text-center border border-slate-700/50">
            <div class="text-2xl font-bold text-green-400" id="completedCount">0</div>
            <div class="text-slate-400 text-xs">Completadas</div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
        <button 
          class="filter-btn px-6 py-3 bg-indigo-600 text-white border-2 border-indigo-600 
                 rounded-xl font-semibold whitespace-nowrap transition-all duration-300
                 hover:bg-indigo-700 shadow-lg shadow-indigo-600/30" 
          data-filter="all"
        >
          📋 Todas
        </button>
        <button 
          class="filter-btn px-6 py-3 bg-slate-700/50 text-slate-300 border-2 border-slate-600 
                 rounded-xl font-semibold whitespace-nowrap transition-all duration-300
                 hover:bg-slate-600 hover:text-white" 
          data-filter="pending"
        >
          ⏳ Pendientes
        </button>
        <button 
          class="filter-btn px-6 py-3 bg-slate-700/50 text-slate-300 border-2 border-slate-600 
                 rounded-xl font-semibold whitespace-nowrap transition-all duration-300
                 hover:bg-slate-600 hover:text-white" 
          data-filter="completed"
        >
          ✅ Completadas
        </button>
      </div>

      <!-- Task List -->
      <div class="mb-6">
        <ul id="taskList" class="space-y-3"></ul>

        <!-- Empty State -->
        <div 
          id="emptyState" 
          class="hidden text-center py-20 px-5"
        >
          <div class="text-7xl mb-6 animate-bounce">🎯</div>
          <h3 class="text-2xl font-bold text-slate-300 mb-2">¡Empieza tu día productivo!</h3>
          <p class="text-slate-400">Agrega tu primera tarea para comenzar</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3">
        <button 
          id="clearCompleted" 
          class="hidden flex-1 px-5 py-3 bg-slate-700/50 text-slate-300 border-2 border-slate-600 
                 rounded-xl font-semibold transition-all duration-300
                 hover:bg-red-600 hover:text-white hover:border-red-600 hover:shadow-lg hover:shadow-red-600/30"
        >
          🗑️ Limpiar completadas
        </button>
        <button 
          id="deleteAll" 
          class="hidden flex-1 px-5 py-3 bg-slate-700/50 text-slate-300 border-2 border-slate-600 
                 rounded-xl font-semibold transition-all duration-300
                 hover:bg-rose-600 hover:text-white hover:border-rose-600 hover:shadow-lg hover:shadow-rose-600/30"
        >
          💥 Eliminar todas
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-8 text-slate-500 text-sm">
      Hecho con 💜 usando Vite + Tailwind CSS
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
